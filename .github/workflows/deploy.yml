name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy is a whole-site replacement, so two in flight can land out of order.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build and assemble separately from the deploy: a Tailwind or copy
      # failure stops here rather than shipping a half-built dist.
      - run: npm run build
      - run: npm run dist

      # wrangler straight from the lockfile, not an action, so CI deploys with
      # the same version as `npm run deploy` on a laptop.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
