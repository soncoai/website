<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The site is one set of pages in five languages, chosen at runtime by
         js/i18n.js — there is no per-language URL to point /comparar at. So the
         Spanish address exists and hands the visitor the same page with Spanish
         already selected, rather than being a second copy of the markup to keep
         in step. noindex for the same reason /compare carries it: the
         competitor figures are still unverified. -->
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/compare?lang=es">
    <title>sonco frente a Inmovilla y Sooprema</title>
    <link rel="canonical" href="https://sonco.ai/compare">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preload" href="/fonts/geist-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/site.css?v=27">
</head>
<body>
    <div class="hero-wash flex min-h-screen flex-col items-center justify-center bg-white px-6 text-center">
        <p class="text-[17px] text-muted">Te llevamos a la comparativa…</p>
        <a href="/compare?lang=es" class="btn mt-7">Ver la comparativa</a>
    </div>
</body>
</html>
